name: Build and publish VOIDTOOLS apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        run: npm run android:apk

      - name: Build Windows app
        run: npm run windows:exe

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk release-assets/VOIDTOOLS-android.apk
          Copy-Item outputs/windows-build/VOIDTOOLS-Windows-1.0.0.exe release-assets/VOIDTOOLS-Windows.exe

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            release-assets/VOIDTOOLS-android.apk `
            release-assets/VOIDTOOLS-Windows.exe `
            --title "VOIDTOOLS $env:GITHUB_REF_NAME" `
            --generate-notes
